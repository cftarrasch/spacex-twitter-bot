[build-system]
requires = ["setuptools>=58"]
build-backend = "setuptools.build_meta"

[project]
name = "spacex-twitter-bot"
version = "0.1.0"
description = "Predict SpaceX launch and landing outcomes and post them to X/Twitter."
requires-python = ">=3.9"
dependencies = [
  "joblib>=1.3",
  "pandas>=2.0",
  "python-dotenv>=1.0",
  "requests>=2.31",
  "scikit-learn>=1.4",
  "tweepy>=4.14",
]

[tool.setuptools.packages.find]
where = ["src"]
